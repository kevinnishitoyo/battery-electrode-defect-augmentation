[project]
name = "battery-electrode-defect-augmentation"
version = "0.1.0"
description = "Reproducible synthetic-data augmentation experiments for multilabel battery-electrode defect classification."
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
    { name = "Kevin Nishitoyo" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pillow",
    "scikit-learn",
    "torch",
    "torchvision",
]

[project.urls]
Repository = "https://github.com/kevinnishitoyo/battery-electrode-defect-augmentation"

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: tests requiring private real or synthetic images",
]

[tool.ruff]
target-version = "py312"
line-length = 88